# ─── Application ──────────────────────────────────────────────
spring.application.name=saree-platform
server.port=8080

# ─── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sareedb}
spring.datasource.username=${DB_USERNAME:sareeadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Security (disabled for MVP dev, enable in Phase 3) ───────
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# ─── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ──────────────────────────────────────────────────
logging.level.com.sareeplatform=DEBUG
logging.level.org.springframework.security=WARN
